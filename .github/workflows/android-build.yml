name: Android builds

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'giftfinder/**'
      - 'mobile/**'
      - 'tools/build_android.py'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    name: Android-${{ matrix.arch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64-v8a
            arguments: ''
          - arch: x86_64
            arguments: '--smoke'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure the preinstalled Android SDK commands
        run: |
          android_sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -x "$android_sdk/cmdline-tools/latest/bin/sdkmanager"
          echo "ANDROID_HOME=$android_sdk" >> "$GITHUB_ENV"
          echo "$android_sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$android_sdk/platform-tools" >> "$GITHUB_PATH"
      - name: Install Android build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y autoconf automake libtool pkg-config cmake ninja-build ccache zlib1g-dev libffi-dev libssl-dev libncurses-dev libtinfo6 libegl1 libopengl0
          python -m pip install 'PySide6-Essentials==6.12.0' 'buildozer==1.6.0' 'Cython==0.29.33' 'Jinja2==3.1.6' 'pkginfo==1.12.1.2' 'packaging==26.3'
          sdkmanager --licenses < <(yes) > /dev/null
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358'
      - name: Restore Android compilation cache
        id: android-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.buildozer/cache
            ~/.buildozer/android/packages
            build/android/wheels
            build/android/${{ matrix.arch }}/compilation
          key: android-qt6.12-ndk28c-p4a58d21141-${{ runner.os }}-${{ matrix.arch }}-v2
      - name: Build and sign APK with the stable application key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          value = os.environ.get('ANDROID_KEYSTORE_BASE64')
          if not value:
              raise SystemExit('Configure the Android signing secrets before building')
          path = Path(os.environ['RUNNER_TEMP']) / 'giftfinder-android-signing.jks'
          path.write_bytes(base64.b64decode(value, validate=True))
          path.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write(f'GIFT_FINDER_ANDROID_KEYSTORE={path}\n')
          PY
          export GIFT_FINDER_ANDROID_KEYSTORE="$RUNNER_TEMP/giftfinder-android-signing.jks"
          python tools/build_android.py build --arch '${{ matrix.arch }}' ${{ matrix.arguments }}
      - name: Enable KVM for the x86_64 emulator
        if: matrix.arch == 'x86_64'
        run: |
          sudo chmod 666 /dev/kvm
          sdkmanager 'emulator' 'system-images;android-35;google_apis;x86_64'
          echo no | avdmanager create avd --force --name giftfinder --package 'system-images;android-35;google_apis;x86_64' --device pixel_5
      - name: Boot emulator and verify the installed mobile application
        if: matrix.arch == 'x86_64'
        run: |
          "$ANDROID_HOME/emulator/emulator" -avd giftfinder -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader -camera-back none -camera-front none > "$RUNNER_TEMP/emulator.log" 2>&1 &
          adb wait-for-device
          for attempt in $(seq 1 90); do
            if [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = '1' ]; then break; fi
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = '1'
          adb shell input keyevent 82
          python tools/build_android.py emulator-test --apk "$(find release-dist -name '*x86_64-smoke.apk' -print -quit)"
      - name: Upload signed Android package
        uses: actions/upload-artifact@v7
        with:
          name: GiftFinder-Android-${{ matrix.arch }}
          path: |
            release-dist/*.apk
            release-dist/SHA256-Android-*.txt
          if-no-files-found: error
          retention-days: 7
      - name: Upload Android verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-Android-${{ matrix.arch }}
          path: |
            build/android/${{ matrix.arch }}/verification.json
            build/android/x86_64/emulator/*.json
            build/android/x86_64/emulator/*.png
            build/android/x86_64/emulator/*.txt
            build/android/x86_64/emulator/*.xml
          if-no-files-found: ignore
          retention-days: 7
      - name: Keep public compilation outputs even after a failed build
        if: always() && steps.android-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.buildozer/cache
            ~/.buildozer/android/packages
            build/android/wheels
            build/android/${{ matrix.arch }}/compilation
          key: android-qt6.12-ndk28c-p4a58d21141-${{ runner.os }}-${{ matrix.arch }}-v2
      - name: Remove the temporary signing keystore
        if: always()
        run: rm -f -- "$RUNNER_TEMP/giftfinder-android-signing.jks"
