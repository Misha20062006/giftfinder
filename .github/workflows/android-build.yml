name: Android builds

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'giftfinder/**'
      - 'mobile/**'
      - 'tools/build_android.py'
      - 'tools/android_*.py'
      - 'tests/test_android_build.py'
      - 'tests/test_mobile*.py'
      - 'requirements*.txt'
      - 'third-party/**'
      - 'THIRD_PARTY_NOTICES.txt'
      - 'UNLICENSE'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    name: Android-${{ matrix.arch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64-v8a
            arguments: ''
          - arch: x86_64
            arguments: '--smoke'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure the preinstalled Android SDK commands
        run: |
          android_sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -x "$android_sdk/cmdline-tools/latest/bin/sdkmanager"
          echo "ANDROID_HOME=$android_sdk" >> "$GITHUB_ENV"
          echo "$android_sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$android_sdk/platform-tools" >> "$GITHUB_PATH"
      - name: Install Android build dependencies
        run: |
          # Use the official Ubuntu archive before apt starts downloading packages.
          sudo sed -i '/azure\.archive\.ubuntu\.com\/ubuntu\//d' /etc/apt/apt-mirrors.txt
          grep -Fq 'https://archive.ubuntu.com/ubuntu/' /etc/apt/apt-mirrors.txt
          sudo apt-get update -q
          sudo apt-get install -y autoconf automake libtool libltdl-dev pkg-config cmake ninja-build p7zip-full ccache zlib1g-dev libffi-dev libssl-dev libncurses-dev libtinfo6 libegl1 libopengl0 fonts-dejavu-core fonts-noto-core
          test -f /usr/share/aclocal/ltdl.m4
          python tools/build_android.py host-requirements > "$RUNNER_TEMP/android-host-requirements.txt"
          python -m pip install -r requirements.txt -r "$RUNNER_TEMP/android-host-requirements.txt" 'pytest==9.1.1'
          python -m pip check
          sdkmanager --licenses < <(yes) > /dev/null
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358'
      - name: Verify Android packaging and mobile behavior on the host
        env:
          QT_QPA_PLATFORM: offscreen
          GIFT_FINDER_DATA_DIR: ${{ github.workspace }}/.qa-android-host/profile
        run: python -m pytest tests/test_android_build.py tests/test_mobile.py tests/test_mobile_smoke.py -q --basetemp .test-android-host
      - name: Fingerprint pinned dependencies, Qt recipes and build flags
        id: android-inputs
        run: |
          fingerprint=$(python tools/build_android.py cache-key)
          test "${#fingerprint}" -eq 64
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
      - name: Restore Android compilation cache
        id: android-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.buildozer/cache
            ~/.buildozer/android/packages
            build/android/wheels
            build/android/runtime-inputs/${{ steps.android-inputs.outputs.fingerprint }}
            build/android/${{ matrix.arch }}/compilation/${{ steps.android-inputs.outputs.fingerprint }}
          key: android-v3-${{ runner.os }}-${{ matrix.arch }}-${{ steps.android-inputs.outputs.fingerprint }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: android-v3-${{ runner.os }}-${{ matrix.arch }}-${{ steps.android-inputs.outputs.fingerprint }}-
      - name: Build and sign APK with the stable application key
        id: android-build
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          value = os.environ.get('ANDROID_KEYSTORE_BASE64')
          if not value:
              raise SystemExit('Configure the Android signing secrets before building')
          path = Path(os.environ['RUNNER_TEMP']) / 'giftfinder-android-signing.jks'
          path.write_bytes(base64.b64decode(value, validate=True))
          path.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write(f'GIFT_FINDER_ANDROID_KEYSTORE={path}\n')
          PY
          export GIFT_FINDER_ANDROID_KEYSTORE="$RUNNER_TEMP/giftfinder-android-signing.jks"
          python tools/build_android.py build --arch '${{ matrix.arch }}' ${{ matrix.arguments }}
      - name: Enable KVM for the x86_64 emulator
        if: matrix.arch == 'x86_64'
        run: |
          sudo chmod 666 /dev/kvm
          export ANDROID_USER_HOME="$RUNNER_TEMP/giftfinder-android-user"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/giftfinder-avd"
          mkdir -p "$ANDROID_USER_HOME" "$ANDROID_AVD_HOME"
          echo "ANDROID_USER_HOME=$ANDROID_USER_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          sdkmanager --channel=0 'emulator' 'platforms;android-36' 'system-images;android-36;google_apis_ps16k;x86_64'
          echo no | avdmanager create avd --force --name giftfinder --path "$ANDROID_AVD_HOME/giftfinder.avd" --package 'system-images;android-36;google_apis_ps16k;x86_64' --device pixel_5
          mkdir -p build/android/x86_64/emulator
          cp "$ANDROID_HOME/system-images/android-36/google_apis_ps16k/x86_64/source.properties" build/android/x86_64/emulator/emulator-image-source-properties.txt
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -Fx giftfinder
      - name: Boot emulator and verify the installed mobile application
        if: matrix.arch == 'x86_64'
        run: |
          evidence=build/android/x86_64/emulator
          mkdir -p "$evidence"
          host_cores=$(nproc)
          emulator_cores=$((host_cores < 4 ? host_cores : 4))
          export GIFT_FINDER_TEST_HOST_CORES="$host_cores"
          export GIFT_FINDER_TEST_EMULATOR_CORES="$emulator_cores"
          host_state() {
            date -u
            echo "host_nproc=$(nproc)"
            free -m
            df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
            ps -eo pid,comm,rss --sort=-rss | head -n 16 || true
          }
          host_state > "$evidence/host-before-emulator.txt"
          echo "gpu=swangle; guest_vulkan=false; guest_ram_mb=4096; guest_cpu_cores=$emulator_cores; image=android-36/google_apis_ps16k/x86_64" > "$evidence/emulator-launch-config.txt"
          "$ANDROID_HOME/emulator/emulator" -avd giftfinder -no-window -no-audio -no-boot-anim -no-snapshot -memory 4096 -cores "$emulator_cores" -show-kernel -gpu swangle -feature -Vulkan -camera-back none -camera-front none > "$evidence/emulator.log" 2>&1 &
          emulator_pid=$!
          cleanup() {
            workflow_status=$?
            host_state > "$evidence/host-after-emulator.txt" 2>&1 || true
            sudo dmesg --ctime | grep -Ei 'out of memory|oom-kill|killed process' > "$evidence/host-oom.txt" || true
            {
              echo "workflow_exit_status=$workflow_status"
              if kill -0 "$emulator_pid" 2>/dev/null; then
                echo 'emulator_process_alive_before_cleanup=true'
              else
                echo 'emulator_process_alive_before_cleanup=false'
                wait "$emulator_pid" && emulator_status=0 || emulator_status=$?
                echo "emulator_exit_status=$emulator_status"
              fi
            } > "$evidence/emulator-process-state.txt"
            timeout 10s adb emu kill >/dev/null 2>&1 || true
            return "$workflow_status"
          }
          trap cleanup EXIT
          deadline=$((SECONDS + 180))
          booted=0
          while [ "$SECONDS" -lt "$deadline" ]; do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              tail -n 80 "$evidence/emulator.log"
              exit 1
            fi
            state=$(timeout 5s adb get-state 2>/dev/null || true)
            if [ "$state" = 'device' ]; then
              complete=$(timeout 5s adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
              if [ "$complete" = '1' ]; then booted=1; break; fi
            fi
            sleep 2
          done
          if [ "$booted" != '1' ]; then
            timeout 10s adb devices -l > "$evidence/adb-devices.txt" 2>&1 || true
            tail -n 80 "$evidence/emulator.log"
            exit 1
          fi
          adb shell input keyevent 82
          adb shell cat /proc/meminfo > "$evidence/guest-memory-before-app.txt"
          adb shell df -h /data > "$evidence/guest-storage-before-app.txt"
          adb logcat -b crash -b system -b main -v threadtime 'ActivityManager:I' 'AndroidRuntime:V' 'Watchdog:V' 'lmkd:V' 'lowmemorykiller:V' 'adbd:V' 'DEBUG:V' 'libc:F' 'tombstoned:V' 'crash_dump64:V' '*:S' > "$evidence/guest-system-live.log" 2>&1 &
          python tools/build_android.py emulator-test --apk "$(find release-dist -name '*x86_64-smoke.apk' -print -quit)"
      - name: Upload signed Android package
        if: always() && steps.android-build.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: GiftFinder-Android-${{ matrix.arch }}
          path: |
            release-dist/*.apk
            release-dist/SHA256-Android-*.txt
          if-no-files-found: error
          retention-days: 7
      - name: Upload Android verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-Android-${{ matrix.arch }}
          path: |
            build/android/${{ matrix.arch }}/verification.json
            build/android/x86_64/emulator/*.json
            build/android/x86_64/emulator/*.png
            build/android/x86_64/emulator/*.txt
            build/android/x86_64/emulator/*.xml
            build/android/x86_64/emulator/*.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Keep public compilation outputs even after a failed build
        if: always() && steps.android-inputs.outcome == 'success' && steps.android-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.buildozer/cache
            ~/.buildozer/android/packages
            build/android/wheels
            build/android/runtime-inputs/${{ steps.android-inputs.outputs.fingerprint }}
            build/android/${{ matrix.arch }}/compilation/${{ steps.android-inputs.outputs.fingerprint }}
          key: android-v3-${{ runner.os }}-${{ matrix.arch }}-${{ steps.android-inputs.outputs.fingerprint }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Remove the temporary signing keystore
        if: always()
        run: rm -f -- "$RUNNER_TEMP/giftfinder-android-signing.jks"
