name: Desktop builds

on:
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'giftfinder/**'
      - '!giftfinder/mobile_ui.py'
      - 'tests/**'
      - '!tests/test_android_build.py'
      - '!tests/test_mobile.py'
      - 'GiftFinder.spec'
      - 'requirements*.txt'
      - 'version-info.txt'
      - 'tools/build_release.py'
      - '.github/workflows/desktop-build.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            target: Windows-x64
          - runner: macos-14
            target: macOS-arm64
          - runner: macos-15-intel
            target: macOS-x64
          - runner: ubuntu-22.04
            target: Linux-x64
          - runner: ubuntu-24.04-arm
            target: Linux-arm64
    runs-on: ${{ matrix.runner }}
    env:
      QT_QPA_PLATFORM: offscreen
      GIFT_FINDER_DATA_DIR: ${{ github.workspace }}/.qa-ci/profile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Linux runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-randr0 libxcb-shape0 fonts-dejavu-core fonts-noto-core
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Run tests with an isolated profile
        run: python -m pytest tests -q --basetemp .test-work
      - name: Build and smoke-test native package
        run: python tools/build_release.py
      - name: Upload native packages
        uses: actions/upload-artifact@v7
        with:
          name: GiftFinder-${{ matrix.target }}
          path: release-dist/*
          if-no-files-found: error
          retention-days: 7
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-${{ matrix.target }}
          path: |
            build/${{ matrix.target }}/verification.json
            build/${{ matrix.target }}/smoke-test/*.txt
            build/${{ matrix.target }}/smoke-test/*.png
          if-no-files-found: ignore
          retention-days: 7
