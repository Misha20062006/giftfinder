name: Desktop builds

on:
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'giftfinder/**'
      - '!giftfinder/mobile_ui.py'
      - 'tests/**'
      - '!tests/test_android_build.py'
      - '!tests/test_mobile*.py'
      - 'GiftFinder.spec'
      - 'requirements*.txt'
      - 'version-info.txt'
      - 'tools/build_release.py'
      - 'tools/installers.py'
      - 'tools/verify_installers.py'
      - 'packaging/**'
      - '.github/workflows/desktop-build.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            target: Windows-x64
          # macOS 14 images retire on 2026-11-02 (actions/runner-images#13518).
          - runner: macos-15
            target: macOS-arm64
          - runner: macos-15-intel
            target: macOS-x64
          - runner: ubuntu-22.04
            target: Linux-x64
          - runner: ubuntu-24.04-arm
            target: Linux-arm64
    runs-on: ${{ matrix.runner }}
    env:
      QT_QPA_PLATFORM: offscreen
      GIFT_FINDER_DATA_DIR: ${{ github.workspace }}/.qa-ci/profile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Linux runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y rpm libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-randr0 libxcb-shape0 fonts-dejavu-core fonts-noto-core
      - name: Prepare the pinned Windows installer compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $download = Join-Path $env:RUNNER_TEMP 'innosetup-7.1.1-x64.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe' -OutFile $download
          if ((Get-FileHash -LiteralPath $download -Algorithm SHA256).Hash.ToLowerInvariant() -ne '8a5a6711c3766a6e5fb74f280ba0e3551e719ce94538d901fdbd1f8f9920b3f0') { throw 'Installer compiler checksum mismatch' }
          $compiler = Join-Path $env:RUNNER_TEMP 'inno-setup'
          $process = Start-Process -FilePath $download -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$compiler") -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Installer compiler installation failed' }
          "ISCC_EXE=$compiler\ISCC.exe" >> $env:GITHUB_ENV
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Run tests with an isolated profile
        run: python -m pytest tests -q --basetemp .test-work
      - name: Build and smoke-test native package
        run: python tools/build_release.py
      - name: Install and update with the system installer, preserving the profile
        run: python tools/verify_installers.py
      - name: Upload native packages
        uses: actions/upload-artifact@v7
        with:
          name: GiftFinder-${{ matrix.target }}
          path: release-dist/*
          if-no-files-found: error
          retention-days: 7
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-${{ matrix.target }}
          path: |
            build/${{ matrix.target }}/verification.json
            build/${{ matrix.target }}/installer-test/verification.json
            build/${{ matrix.target }}/installer-test/smoke/*.txt
            build/${{ matrix.target }}/installer-test/smoke/*.png
            build/${{ matrix.target }}/installer-test/rpm-smoke/*.txt
            build/${{ matrix.target }}/smoke-test/*.txt
            build/${{ matrix.target }}/smoke-test/*.png
          if-no-files-found: ignore
          retention-days: 7
